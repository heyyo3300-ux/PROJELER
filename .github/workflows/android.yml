name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle current published game
        run: node android/prepare-assets.cjs --source docs
      - name: Build installable test APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and release metadata
        run: |
          APK_PATH='android/app/build/outputs/apk/debug/app-debug.apk'
          VERIFY_PATH='android/app/build/outputs/apk/debug/apk-verification.txt'
          SDK_TOOL_PATH='/usr/local/lib/android/sdk/build-tools/35.0.0'
          "$SDK_TOOL_PATH/apksigner" verify --verbose --print-certs "$APK_PATH" | tee "$VERIFY_PATH"
          "$SDK_TOOL_PATH/aapt2" dump badging "$APK_PATH" | tee -a "$VERIFY_PATH"
          grep -F "package: name='com.rvmsystems.doadongukosusu'" "$VERIFY_PATH"
          grep -F "versionCode='202611245'" "$VERIFY_PATH"
          grep -F "versionName='20261124-5'" "$VERIFY_PATH"
          sha256sum "$APK_PATH" | tee -a "$VERIFY_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: DOA-Dongu-Kosusu-Android-20261124-5
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
